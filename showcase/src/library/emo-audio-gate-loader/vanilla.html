<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio-Gated Entrance Loader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=IBM+Plex+Mono:wght@300;400&family=Inter+Tight:wght@500&display=swap" />
<style>
  :root { --lilac: #f5efff; --ink: #2a1647; --night: #121212; --muted: #a3a6c1; --primary: #9047ff; --primary-active: #7114ff;
          --curtain: cubic-bezier(0.65, 0, 0.35, 1); --expo: cubic-bezier(0.16, 1, 0.3, 1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--lilac); color: var(--ink); overflow: hidden; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 300; }
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; }
  .page small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #64698b; }
  .page h1 { font-size: clamp(36px, 8vw, 96px); line-height: .92; opacity: 0; transform: translateY(30px); transition: transform 1.2s var(--expo) .5s, opacity 1s var(--expo) .5s; }
  .entered .page h1 { opacity: 1; transform: none; }
  .loader { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--night); color: #fff;
            clip-path: inset(0 0 0% 0); transition: clip-path 1.1s var(--curtain); }
  .entered .loader { clip-path: inset(0 0 100% 0); }
  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .row small, .foot { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .center { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .pct { font-size: clamp(56px, 14vw, 140px); line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; }
  .gate { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; opacity: 0; transform: translateY(10px); pointer-events: none;
          transition: opacity .6s var(--expo), transform .6s var(--expo); }
  .ready .gate { opacity: 1; transform: none; pointer-events: auto; }
  .gate button { padding: 12px 20px; border-radius: 999px; font: 500 14px "Inter Tight", sans-serif; cursor: pointer; }
  .with { border: 0; background: var(--primary); color: #fff; }
  .with:hover { background: var(--primary-active); }
  .without { border: 1px solid rgb(255 255 255 / .2); background: none; color: rgb(255 255 255 / .8); }
  .without:hover { border-color: rgb(255 255 255 / .5); color: #fff; }
  .bar { height: 1px; background: rgb(255 255 255 / .15); }
  .bar div { height: 100%; background: var(--primary); transform-origin: left; transform: scaleX(0); }
  .foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; }
</style>
</head>
<body>
  <main class="page"><small class="mono">( 01 ) — Welcome</small><h1 class="serif">We craft emotions.</h1></main>
  <div class="loader" role="status" aria-live="polite">
    <div class="row"><span class="serif" style="font-size:clamp(22px,3.6vw,32px)">emotion</span><small class="mono">Loading experience</small></div>
    <div class="center">
      <span class="pct mono">000</span>
      <div class="gate"><button class="with">🔊 Enter with sound</button><button class="without">Enter without sound</button></div>
    </div>
    <div><div class="bar"><div></div></div><div class="foot mono"><span>Headphones recommended</span><span>© 2016—2026</span></div></div>
  </div>

<script>
  const DURATION = 2200, body = document.body, pctEl = document.querySelector(".pct"), bar = document.querySelector(".bar div");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start = performance.now();
  (function tick(now) {
    const p = reduce ? 1 : Math.min(1, (now - start) / DURATION);
    const eased = p < 0.6 ? (p / 0.6) * 0.7 : 0.7 + ((p - 0.6) / 0.4) ** 2 * 0.3; // stall near 70%
    const v = Math.round(eased * 100);
    pctEl.textContent = String(v).padStart(3, "0");
    bar.style.transform = `scaleX(${v / 100})`;
    if (p < 1) requestAnimationFrame(tick);
    else { body.classList.add("ready"); document.querySelector(".with").focus({ preventScroll: true }); }
  })(start);

  function playPad() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), now = ctx.currentTime;
    const filter = ctx.createBiquadFilter(), master = ctx.createGain();
    filter.type = "lowpass"; filter.frequency.value = 900;
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.12, now + 1.6);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 5.5);
    filter.connect(master).connect(ctx.destination);
    [110, 164.81, 246.94].forEach((f, i) => [-6, 6].forEach((cents) => { // A2 E3 B3, detuned pairs
      const o = ctx.createOscillator(); o.type = i === 0 ? "sine" : "triangle"; o.frequency.value = f; o.detune.value = cents;
      o.connect(filter); o.start(now); o.stop(now + 5.6);
    }));
    setTimeout(() => ctx.close(), 6000);
  }
  const enter = (sound) => { if (sound) playPad(); body.classList.add("entered"); };
  document.querySelector(".with").addEventListener("click", () => enter(true));
  document.querySelector(".without").addEventListener("click", () => enter(false));
</script>
</body>
</html>
