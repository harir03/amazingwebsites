<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanical Floating Navbar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #FAF8F5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
    
    .nav-container {
      width: 100%;
      max-width: 720px;
      background: rgba(31, 38, 30, 0.92);
      backdrop-filter: blur(12px);
      color: #FAF8F5;
      border-radius: 9999px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 20px 40px -10px rgba(31, 38, 30, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .menu-btn {
      background: none;
      border: none;
      color: #FAF8F5;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: monospace;
    }
    .hamburger { width: 20px; display: flex; flex-direction: column; gap: 5px; }
    .hamburger span { display: block; height: 1.5px; width: 100%; background: #FAF8F5; transition: transform 0.3s; }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 18px;
      color: #FAF8F5;
    }
    .brand svg { width: 22px; height: 22px; color: #C5A880; }
    
    .inquire-btn {
      background: none;
      border: 1px solid rgba(197, 168, 128, 0.5);
      border-radius: 9999px;
      padding: 8px 18px;
      color: #FAF8F5;
      font-size: 11px;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      overflow: hidden;
      height: 34px;
      transition: border-color 0.2s;
    }
    .inquire-btn:hover { border-color: #C5A880; }
    .label-wrap { display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .inquire-btn:hover .label-wrap { transform: translateY(-16px); }
    .label-wrap span { height: 16px; display: flex; align-items: center; gap: 6px; }
    .label-wrap .alt { color: #C5A880; }

    .drawer {
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
      background: #1F261E;
      border-radius: 24px;
      padding: 24px;
      color: #FAF8F5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 20px;
      font-size: 13px;
    }
    .drawer.active { display: grid; }
    .drawer h5 { color: #C5A880; font-size: 10px; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .drawer ul { list-style: none; }
    .drawer li { margin-bottom: 6px; opacity: 0.75; cursor: pointer; }
    .drawer li:hover { opacity: 1; }
  </style>
</head>
<body>

  <header class="nav-container">
    <button class="menu-btn" id="toggleBtn" aria-label="Toggle Menu">
      <div class="hamburger">
        <span></span>
        <span></span>
      </div>
      <span>Menu</span>
    </button>

    <div class="brand">
      <svg viewBox="0 0 35 35" fill="none">
        <path d="M0 6.7V12.2C0 14.9 2.2 17.1 4.8 17.1H9.2C10.7 14 13.9 11.8 17.5 11.8H19.3C21.7 11.8 23.7 10 24 7.7C20.2 7.2 17.2 4 17.1 0H15V3C15 6.6 12.5 9.7 9.1 10.6C10 11.4 11.1 11.8 12.3 11.8H13C12.4 12.1 11.8 12.6 11.3 13.1C10.6 13.8 10 14.7 9.6 15.6C6 14.6 3.3 11.4 3.1 7.4C2 7.4 1 7.1 0 6.7Z" fill="currentColor"/>
        <path d="M35 4.6C33.9 7.9 31.1 10.3 27.6 10.8C26.2 14 23 16.2 19.3 16.2H17.5C14.9 16.2 12.7 18.3 12.7 21V35H22.3V21C22.3 19.4 21.6 18 20.4 17.1C21.1 17 21.8 16.9 22.5 16.6C23.3 16.3 24 15.8 24.7 15.2C25.9 16.7 26.6 18.5 26.7 20.6H30.2C32.7 20.6 34.7 18.7 35 16.3V4.6Z" fill="currentColor"/>
      </svg>
      <span>Belgrade Arbor</span>
    </div>

    <button class="inquire-btn">
      <div class="label-wrap">
        <span>Inquire →</span>
        <span class="alt">Connect ✦</span>
      </div>
    </button>
  </header>

  <div class="drawer" id="menuDrawer">
    <div>
      <h5>Architecture</h5>
      <ul>
        <li>Canopy Facade</li>
        <li>Living Gardens</li>
        <li>Breezeway Solar</li>
      </ul>
    </div>
    <div>
      <h5>Residences</h5>
      <ul>
        <li>Penthouse Suites</li>
        <li>Duplex Villas</li>
        <li>2-Bedroom Lofts</li>
      </ul>
    </div>
    <div>
      <h5>District</h5>
      <ul>
        <li>Airport City</li>
        <li>West 65 Node</li>
        <li>Tošin Bunar</li>
      </ul>
    </div>
  </div>

  <script>
    const btn = document.getElementById('toggleBtn');
    const drawer = document.getElementById('menuDrawer');
    btn.addEventListener('click', () => {
      drawer.classList.toggle('active');
    });
  </script>
</body>
</html>
