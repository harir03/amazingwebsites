<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CSS Coin Pile Loader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@800&display=swap" />
<style>
  :root { --paper: #f4f3ef; --ink: #14140f; --y1: #f8e08a; --y2: #f2c31a; --y3: #c98f06; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: var(--paper); color: var(--ink);
         font-family: Nunito, system-ui, sans-serif; }
  .word { font: 400 clamp(34px, 8vw, 72px)/1 "Luckiest Guy", cursive; letter-spacing: .03em; color: var(--y2); -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 4px 0 var(--ink); }
  .pile { position: relative; width: 180px; height: 150px; animation: wipe 5s linear infinite; }
  @keyframes wipe { 0%, 85% { opacity: 1; } 93%, 100% { opacity: 0; } }
  .coin { position: absolute; left: 50%; bottom: 10px; width: 46px; height: 20px; margin-left: -23px; opacity: 0;
          animation-duration: 5s; animation-iteration-count: infinite; animation-fill-mode: both; }
  .coin::before { content: ""; position: absolute; inset: 6px 0 -6px; border-radius: 50%; background: var(--y3); border: 2px solid var(--ink); }
  .coin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ink);
                 background: radial-gradient(ellipse at 35% 35%, var(--y1) 0 22%, var(--y2) 23% 62%, var(--y3) 63%); }
  .label { padding: 6px 16px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; box-shadow: 2px 3px 0 var(--ink);
           font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .label::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .pile, .coin { animation: none !important; opacity: 1; } }
</style>
</head>
<body>
  <p class="word">DON'T LOOK UP</p>
  <div class="pile" aria-hidden="true"></div>
  <p class="label" role="status">Counting your money</p>

<script>
  // Generates one @keyframes block per coin on a shared 5s cycle. Regenerate rather than hand-edit.
  const CYCLE = 5, STAGGER = 0.13, EASE = "cubic-bezier(0.4, 0, 0.9, 0.42)";
  const LAYOUT = [[0,0],[1,0],[-1,0],[0,1],[1,1],[0,2],[-1,1],[1,2],[0,3],[-1,2],[1,3],[0,4],[-1,3],[0,5],[1,4],[0,6],[-1,4],[0,7]];
  const pct = (s) => `${((s / CYCLE) * 100).toFixed(2)}%`;
  const pile = document.querySelector(".pile");
  let css = "";
  LAYOUT.forEach(([col, h], i) => {
    const x = col * 40 + (Math.random() - 0.5) * 6, tilt = (Math.random() - 0.5) * 8, spin = 90 + Math.random() * 140, lift = -h * 12, s = i * STAGGER;
    const land = `translate3d(${x}px, ${lift}px, ${h}px) rotate(${tilt}deg)`;
    css += `@keyframes drop-${i} {
      0%, ${pct(s)} { transform: translate3d(${x}px, ${lift - 200}px, 90px) rotate(${spin}deg); opacity: 0; animation-timing-function: ${EASE}; }
      ${pct(s + 0.08)} { opacity: 1; }
      ${pct(s + 1.05)} { transform: ${land}; animation-timing-function: ease-out; }
      ${pct(s + 1.15)} { transform: translate3d(${x}px, ${lift - 8}px, ${h}px) rotate(${tilt}deg); }
      ${pct(s + 1.25)}, 100% { transform: ${land}; opacity: 1; }
    }
    .coin:nth-child(${i + 1}) { animation-name: drop-${i}; z-index: ${h * 3 + 1}; }
    @media (prefers-reduced-motion: reduce) { .coin:nth-child(${i + 1}) { transform: ${land}; } }`;
    pile.insertAdjacentHTML("beforeend", '<span class="coin"></span>');
  });
  document.head.insertAdjacentHTML("beforeend", `<style>${css}</style>`);
</script>
</body>
</html>
