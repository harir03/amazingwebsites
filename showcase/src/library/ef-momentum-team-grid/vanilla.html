<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentum Team Grid — Extrafazant</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #DCDCDC;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #101010;
    }
    .grid-container {
      width: 100%;
      max-width: 960px;
      background: #EFEFEF;
      border: 1px solid rgba(16, 16, 16, 0.1);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 48px rgba(0,0,0,0.06);
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 2rem;
    }
    .eyebrow {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #0038FF;
    }
    .heading {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      margin-top: 0.25rem;
    }
    .alt-font {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      color: #0038FF;
      font-weight: 400;
    }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      perspective: 1000px;
    }
    .member-card {
      background: #FFF;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(16, 16, 16, 0.08);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
    }
    .member-card:hover {
      box-shadow: 0 16px 36px rgba(0,0,0,0.14);
    }
    .photo-wrap {
      height: 220px;
      position: relative;
      background: #ECECEC;
      overflow: hidden;
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .member-card:hover .photo-wrap img {
      transform: scale(1.05);
    }
    .info-wrap {
      padding: 1.25rem;
    }
    .name {
      font-size: 1.25rem;
      font-weight: 800;
    }
    .role {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: rgba(16, 16, 16, 0.6);
      margin-top: 0.25rem;
    }
    @media (max-width: 768px) {
      .team-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="header">
      <div>
        <div class="eyebrow">Het Creatieve Team</div>
        <h2 class="heading">ABCDEF-<span class="alt-font">Team</span></h2>
      </div>
      <p style="font-size: 0.85rem; max-width: 280px; opacity: 0.7;">
        Beweeg je cursor over de teamleden om de fysieke momentum-rotatie te ervaren.
      </p>
    </div>

    <div class="team-grid">
      <!-- Member 1 -->
      <div class="member-card">
        <div class="photo-wrap">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Tom">
        </div>
        <div class="info-wrap">
          <div class="name">Tom</div>
          <div class="role">Creative Director</div>
        </div>
      </div>

      <!-- Member 2 -->
      <div class="member-card">
        <div class="photo-wrap">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80" alt="Willem">
        </div>
        <div class="info-wrap">
          <div class="name">Willem</div>
          <div class="role">Lead Motion Designer</div>
        </div>
      </div>

      <!-- Member 3 -->
      <div class="member-card">
        <div class="photo-wrap">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Daan">
        </div>
        <div class="info-wrap">
          <div class="name">Daan</div>
          <div class="role">Video Producer</div>
        </div>
      </div>

      <!-- Member 4 -->
      <div class="member-card">
        <div class="photo-wrap">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Fleur">
        </div>
        <div class="info-wrap">
          <div class="name">Fleur</div>
          <div class="role">Animation &amp; 3D Artist</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.member-card');
    cards.forEach(card => {
      let enterX = 0;
      let enterY = 0;

      card.addEventListener('pointerenter', e => {
        enterX = e.clientX;
        enterY = e.clientY;
        card.style.transition = 'transform 0.08s ease-out, box-shadow 0.2s';
      });

      card.addEventListener('pointermove', e => {
        const dx = e.clientX - enterX;
        const dy = e.clientY - enterY;
        enterX = e.clientX;
        enterY = e.clientY;

        const rx = Math.max(-14, Math.min(14, dy * 0.6));
        const ry = Math.max(-14, Math.min(14, -dx * 0.6));
        const rz = Math.max(-10, Math.min(10, dx * 0.35));

        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
      });

      card.addEventListener('pointerleave', () => {
        card.style.transition = 'transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s';
        card.style.transform = 'rotateX(0deg) rotateY(0deg) rotateZ(0deg)';
      });
    });
  </script>
</body>
</html>
