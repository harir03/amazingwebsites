<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isometric Wireframe Grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Geist+Mono&display=swap" />
<style>
  :root { --ink: #282828; --paper: #fafafa; --rule: #b3b3af; --muted: #72726f; --brand: #fa3600; --ease: cubic-bezier(0.22, 1, 0.36, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Space Grotesk", Arial, sans-serif; padding: 24px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 16px; }
  h2 { font-size: clamp(20px, 3.6vw, 36px); line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
  .mono { font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  ul { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  @media (max-width: 900px) { ul { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { ul { grid-template-columns: 1fr; } }
  .card { display: flex; flex-direction: column; min-height: 260px; padding: 16px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
          color: inherit; text-decoration: none; transition: background-color .45s var(--ease), color .45s; }
  .card svg { width: 70%; max-width: 150px; margin: 12px auto; flex: 1; }
  .card p { font-size: 13px; line-height: 1.35; opacity: .8; }
  .base { stroke: var(--rule); transition: stroke .45s; }
  .rest { stroke: var(--brand); opacity: .55; transition: opacity .3s; }
  .draw { stroke: var(--paper); stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s var(--ease); }
  .draw.accent { stroke: var(--brand); transition-delay: .15s; }
  .card:hover, .card:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .card:hover .base, .card:focus-visible .base { stroke: #414140; }
  .card:hover .rest, .card:focus-visible .rest { opacity: 0; }
  .card:hover .draw, .card:focus-visible .draw { stroke-dashoffset: 0; }
  @media (prefers-reduced-motion: reduce) { .draw { transition: none; } }
</style>
</head>
<body>
  <div class="head"><h2>Review is broken</h2><span class="mono" style="color:var(--muted)">Fig. 02 — Problem</span></div>
  <ul id="grid"></ul>

<script>
  const cards = [
    { tag: "01", title: "Manual", body: "Checks happen by eye, sheet by sheet, long after the model changed.",
      shape: ["M20 72 L60 52 L100 72 L60 92 Z", "M46 32 V84 M74 32 V84", "M46 84 A14 7 0 0 0 74 84"], accent: "M46 32 A14 7 0 1 0 74 32 A14 7 0 1 0 46 32" },
    { tag: "02", title: "Disjointed", body: "Comments live in PDFs and chats, nowhere near the geometry.",
      shape: ["M40 72 L60 62 L80 72 L80 97 L60 107 L40 97 Z", "M40 72 L60 82 L80 72 M60 82 V107", "M44 44 A16 5 0 0 0 76 44"], accent: "M44 44 A16 16 0 1 1 76 44 A16 16 0 1 1 44 44" },
    { tag: "03", title: "Blind", body: "Clashes and code issues surface on site, where they cost the most.",
      shape: ["M48 58 L60 52 L72 58 L72 74 L60 80 L48 74 Z", "M48 58 L60 64 L72 58 M60 64 V80"], accent: "M16 66 A44 22 0 1 0 104 66 A44 22 0 1 0 16 66" },
    { tag: "04", title: "Slow", body: "Every revision restarts the review cycle from zero.",
      shape: ["M20 48 L55 30 L90 48 L55 66 Z", "M30 64 L65 46 L100 64 L65 82 Z"], accent: "M40 80 L75 62 L110 80 L75 98 Z" },
  ];
  document.getElementById("grid").innerHTML = cards.map((c) => `
    <li><a class="card" href="#${c.title.toLowerCase()}">
      <span class="mono">[${c.tag}] ${c.title}</span>
      <svg viewBox="0 0 120 120" fill="none" stroke-width="1.2" aria-hidden="true">
        ${c.shape.map((d) => `<path class="base" d="${d}"/>`).join("")}
        <path class="rest" d="${c.accent}"/>
        ${c.shape.map((d) => `<path class="draw" pathLength="1" d="${d}"/>`).join("")}
        <path class="draw accent" pathLength="1" d="${c.accent}"/>
      </svg>
      <p>${c.body}</p>
    </a></li>`).join("");
</script>
</body>
</html>
