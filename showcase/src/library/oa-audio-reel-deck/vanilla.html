<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Stem Audio Reel Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #08080A; color: #E9ECEE; padding: 24px; display: flex; justify-content: center; }
    .card {
      width: 100%;
      max-width: 820px;
      background: #08080A;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px;
    }
    .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .sub { font-size: 11px; font-family: monospace; color: #A3E635; text-transform: uppercase; letter-spacing: 1px; }
    h2 { font-size: 24px; font-weight: 800; margin-top: 4px; }
    
    .master-btn {
      background: #A3E635;
      color: #08080A;
      border: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 11px;
      font-family: monospace;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .master-btn.active { background: white; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 20px; }
    .stem-card {
      background: #13151F;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header { display: flex; justify-content: space-between; font-size: 11px; font-family: monospace; }
    .db { color: #A3E635; font-size: 10px; }
    
    .waveform {
      height: 52px;
      background: #08080A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .bar {
      width: 100%;
      height: 24px;
      background: rgba(163, 230, 53, 0.25);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-family: monospace;
      color: #A3E635;
      transition: all 0.2s;
    }
    
    .btns { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      padding: 6px 0;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
    }
    .btn.mute-active { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #f87171; }
    .btn.solo-active { background: #A3E635; color: #08080A; border-color: #A3E635; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <div class="top">
      <div>
        <span class="sub">Multi-Stem Mixing Console</span>
        <h2>Game Audio Reel Deck</h2>
      </div>
      <button class="master-btn" id="masterBtn">▶ Play All Stems</button>
    </div>

    <div class="grid">
      <!-- Stem 1 -->
      <div class="stem-card" data-stem="sub">
        <div class="header">
          <span>CH 01 · SUB BASS</span>
          <span class="db">−6.2 dB</span>
        </div>
        <div class="waveform">
          <div class="bar">60Hz Drone</div>
        </div>
        <div class="btns">
          <button class="btn btn-mute">Mute</button>
          <button class="btn btn-solo">Solo</button>
        </div>
      </div>

      <!-- Stem 2 -->
      <div class="stem-card" data-stem="perc">
        <div class="header">
          <span>CH 02 · PERCUSSION</span>
          <span class="db">−3.4 dB</span>
        </div>
        <div class="waveform">
          <div class="bar">Glitch Rhythm</div>
        </div>
        <div class="btns">
          <button class="btn btn-mute">Mute</button>
          <button class="btn btn-solo">Solo</button>
        </div>
      </div>

      <!-- Stem 3 -->
      <div class="stem-card" data-stem="lead">
        <div class="header">
          <span>CH 03 · SYNTH LEAD</span>
          <span class="db">−4.8 dB</span>
        </div>
        <div class="waveform">
          <div class="bar">Filtered Arp</div>
        </div>
        <div class="btns">
          <button class="btn btn-mute">Mute</button>
          <button class="btn btn-solo">Solo</button>
        </div>
      </div>

      <!-- Stem 4 -->
      <div class="stem-card" data-stem="sfx">
        <div class="header">
          <span>CH 04 · FOLEY / SFX</span>
          <span class="db">−8.1 dB</span>
        </div>
        <div class="waveform">
          <div class="bar">UI Servos</div>
        </div>
        <div class="btns">
          <button class="btn btn-mute">Mute</button>
          <button class="btn btn-solo">Solo</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const master = document.getElementById('masterBtn');
    let playing = false;
    master.addEventListener('click', () => {
      playing = !playing;
      master.classList.toggle('active', playing);
      master.textContent = playing ? '⏸ Pause Stems' : '▶ Play All Stems';
    });

    document.querySelectorAll('.btn-mute').forEach(b => {
      b.addEventListener('click', () => b.classList.toggle('mute-active'));
    });

    document.querySelectorAll('.btn-solo').forEach(b => {
      b.addEventListener('click', () => b.classList.toggle('solo-active'));
    });
  </script>
</body>
</html>
